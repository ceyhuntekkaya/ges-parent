spring:
  profiles:
    active: auto-db-create
  jpa:
    database: POSTGRESQL
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: false
        se_sql_comments: false
        transaction:
          jta:
            platform: org.hibernate.engine.trans1"action.jta.platform.internal.NoJtaPlatform
  datasource:
    dbName: ges_project_app
    dbUrl: jdbc:postgresql://localhost:5432/


    url: ${spring.datasource.dbUrl}${spring.datasource.dbName}
    username: genixo
    password: genixo
    driverClassName: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: MyHikariCP
      transaction-isolation: TRANSACTION_READ_COMMITTED
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true

  flyway:
    enabled: true
    url: ${spring.datasource.dbUrl}${spring.datasource.dbName}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    schemas: public
    placeholders:
      admin_email: ${GES_ADMIN_EMAIL:admin@genixo.ai}
      admin_password_hash: ${GES_ADMIN_PASSWORD_HASH:$2a$10$SB1j96YP8/iWs2bX760qFOLWRcERqgvshJl6FdpxhUG5zXouRMzZ6}


  # Multipart ayarlar? buraya ta??nd?
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB        # Maksimum dosya boyutu
      max-request-size: 100MB     # Maksimum request boyutu
      file-size-threshold: 2KB   # Bellek eşiği

management:
  endpoints:
    web:
      base-path: /actuator

server:
  servlet:
    context-path: /api
  # Tomcat ayarlar? eklendi
  tomcat:
    max-swallow-size: 1GB
    max-http-form-post-size: 1GB
logging:
  level:
    root: INFO
    com.genixo.education.search: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.hibernate.orm.jdbc.bind: OFF

storage:
  base: /Users/macpro/Desktop/file/





application:
  security:
    jwt:
      secret-key: uLO6QrqPEmyHZfU1jR3vS8wX2nKgT4iN9bAcDhMkVpYe7tWsJxG5aFdB0CzI4nPmQvUyL8kR3wT9
      expiration: 31536000000
      refresh-token:
        expiration: 31536000000

# SpringDoc/Swagger konfigürasyonu
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  # Önemli: packages-to-scan ile tarama alanını sınırlayın
  packages-to-scan: com.genixo.ges
  # Default response'ları devre dışı bırak
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  # Hata durumlarında daha detaylı log için
  show-actuator: false

